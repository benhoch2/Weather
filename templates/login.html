<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Nowcast</title>
<style>
  :root { color-scheme: light; --bg: #f4f4f2; --surface: #fcfcfb; --border: #dcdbd6; --text: #0b0b0b;
          --text-2: #52514e; --accent: #2a78d6; --bad: #b42323; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #34342f;
      --text: #f0efec; --text-2: #c3c2b7; --accent: #3987e5; --bad: #e66767; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #34342f;
      --text: #f0efec; --text-2: #c3c2b7; --accent: #3987e5; --bad: #e66767; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg);
         color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
  p { margin: 0 0 18px; color: var(--text-2); font-size: 13.5px; }
  label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
          border-radius: 8px; padding: 9px 11px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
           border: 0; border-radius: 8px; padding: 10px; cursor: pointer; }
  .error { color: var(--bad); font-size: 13.5px; margin-top: 12px; }
</style>
</head>
<body>
  <form method="post" autocomplete="on">
    <h1>Rain Nowcast</h1>
    <p>Rain forecasts for the next 60 minutes. Enter the password; this browser will remember it.</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit">Enter</button>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
